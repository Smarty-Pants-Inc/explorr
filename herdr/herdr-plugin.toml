id = "com.smartypants.explorr"
name = "Explorr"
version = "1.0.3"
min_herdr_version = "0.9.1"
description = "Workspace file explorer and editor for HerdR"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "install.sh"]

[[actions]]
id = "open-file"
title = "Open file in Explorr"
description = "Markdown and review=1 links require Reviewr at their encoded line; other local files open in a visible, unfocused Explorr right split beside the originating pane (click it to focus)"
command = [
  "sh",
  "-c",
  '''if [ -x "$HERDR_PLUGIN_ROOT/bin/explorr" ]; then exec "$HERDR_PLUGIN_ROOT/bin/explorr" --herdr-open "$HERDR_PLUGIN_CLICKED_URL"; else exec explorr --herdr-open "$HERDR_PLUGIN_CLICKED_URL"; fi''',
]

[[link_handlers]]
id = "local-file"
title = "Open local file"
pattern = "^file://"
action = "open-file"

[[panes]]
id = "explorer"
title = "explorer"
description = "Explicitly browse files beside the originating pane"
placement = "split"
command = ["sh", "-c", '''if [ -x "$HERDR_PLUGIN_ROOT/bin/explorr" ]; then exec "$HERDR_PLUGIN_ROOT/bin/explorr" --explorer; else exec explorr --explorer; fi''']
