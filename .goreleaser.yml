#
# GoReleaser config for Explorr. `.github/workflows/release.yml` runs it only
# when manually dispatched: it tags v<x.y.z>, cross-compiles the binary,
# packages it, and attaches it to a GitHub Release. The workflow renders the
# same-repo Homebrew formula from GoReleaser's checksums afterward.

version: 2

project_name: explorr

before:
  hooks:
    - go mod tidy

builds:
  - id: explorr
    binary: explorr
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Skip windows/arm64 — less common, and we'd rather not ship binaries
    # we can't easily test. Add it back if there's demand.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - NOTICE

      - herdr/**
checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      # The release job's own commits. Without this, release notes are dominated
      # by version bumps and same-repo Homebrew formula updates.
      - "\\[skip ci\\]"
      # Conventional-commit prefixes. Kept for anyone who uses them, but note this repo writes prose
      # subjects ("Warn that a source build goes stale…"), so these match nothing here -- they are not
      # quietly doing the filtering above.
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
