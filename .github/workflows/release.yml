#
# Release pipeline for Explorr. Manual-only during the rename milestone:
#
#   1. Checks that the binary and bundled HerdR plugin versions agree. If the
#      dispatched commit hand-edited both versions (you bumped major/minor
#      manually), the workflow uses that version as-is. Otherwise it auto-bumps
#      the patch number in both files, commits the change to main with [skip ci],
#      and pushes.
#   2. Tags v<x.y.z> and pushes the tag.
#   3. Runs GoReleaser to cross-compile binaries (linux/darwin/windows ×
#      amd64/arm64), package them, and attach them to a GitHub Release.
#   4. Renders and commits the same-repo Homebrew formula from the checksums.

name: Release

on:
  # Deliberate manual cutover: do not release on ordinary pushes.
  workflow_dispatch:

# A manual release writes version, tags, and the same-repo formula, so it
# needs repository contents write access.
permissions:
  contents: write

# Serialise releases — no two version-bumps racing each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the workflow can inspect HEAD~1 for the
          # "did this commit hand-edit version.go?" check, and so
          # goreleaser sees prior tags for changelog generation.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # Decide whether to auto-bump or accept a hand-edited version.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          CURRENT=$(python3 scripts/set-release-version.py --check)

          # If the pushed commit changed either synchronized version file, treat
          # that as a manual major/minor bump and use the value as-is. Otherwise
          # auto-bump the patch.
          if git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -Eq '^(internal/version/version.go|herdr/herdr-plugin.toml)$'; then
            echo "Version was manually edited to $CURRENT — using as-is."
            echo "version=$CURRENT"  >> "$GITHUB_OUTPUT"
            echo "bumped=false"      >> "$GITHUB_OUTPUT"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Auto-bumping $CURRENT → $NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "bumped=true"  >> "$GITHUB_OUTPUT"
          fi

      # Commit the synchronized binary and plugin versions back to main. The [skip ci] marker
      # in the commit message tells GitHub Actions not to re-run this
      # workflow (which would loop forever).
      # Git identity, set once for EVERY step that writes a git object. This used
      # to live inside "Commit version bump" below, which is gated on the
      # auto-bump path — so "Tag release" borrowed it as a side effect and only
      # worked when a bump had happened. Hand-edit version.go and the bump step
      # is skipped, leaving `git tag -a` (annotated, so it needs a committer) to
      # die with "fatal: empty ident name". That is the path the file header
      # documents as supported for a manual major/minor bump, and it had never
      # once run: v0.2.0 was merged, the job failed in 17s, and nothing shipped.
      #
      # A step that configures state must not be gated on a branch that other
      # steps depend on.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"

          python3 scripts/set-release-version.py "$NEW"

          git add internal/version/version.go herdr/herdr-plugin.toml
          git commit -m "Release v$NEW [skip ci]"
          git push origin HEAD:main

      # Always create + push the tag (even when version was hand-edited
      # — that's the whole point of accepting it as-is).
      - name: Tag release
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "Tag v$NEW already exists, skipping."
            exit 0
          fi
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin "v$NEW"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          python3 scripts/render-homebrew-formula.py "$NEW" dist/checksums.txt Formula/explorr.rb
          git add Formula/explorr.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already current."
            exit 0
          fi
          git commit -m "Update explorr brew formula to v$NEW [skip ci]"
          git push origin HEAD:main

      # NO Pages dispatch here. Upstream spice-edit deploys a marketing site from
      # a pages.yml workflow and this step was inherited with the rest of the
      # pipeline — but this fork has no pages.yml, so `gh workflow run pages.yml`
      # died with "HTTP 422: Workflow does not have workflow_dispatch trigger" and
      # took the whole job down with it. Every release from v0.1.2 to v0.1.6 is
      # marked FAILED for that reason alone, while having already tagged, built
      # all five platforms, published the GitHub Release and written the brew
      # formula. Same shape as the old upstream-owned release-coordinate bug:
      # inherited config pointing at infrastructure this fork does not have.
      #
      # A red release that actually shipped is worse than either outcome alone --
      # it trains you to ignore the signal, so a genuine GoReleaser failure would
      # have looked identical. Restore this only alongside a real pages.yml that
      # declares workflow_dispatch.
